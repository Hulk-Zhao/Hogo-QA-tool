name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: 类型 / 静态检查 / 单测 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run sample:verify
      - run: npm run build
      - run: npm run build:server
